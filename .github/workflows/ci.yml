name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR에 새 push가 오면 진행 중인 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (lint · build · test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # D26(2026-09-28) — auth 모듈이 PrismaService로 이관되면서 앱 부팅(테스트 포함) 자체가
    # DATABASE_URL 연결을 요구하게 됐다. docker-compose.yml의 로컬 개발용 Postgres와 같은
    # 이미지·자격증명을 그대로 재사용한 CI 전용 컨테이너 — 실제 Supabase와는 무관하다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sports_erp
          POSTGRES_PASSWORD: change-me-in-local-env
          POSTGRES_DB: sports_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://sports_erp:change-me-in-local-env@localhost:5432/sports_erp?schema=public
      # D27 — schema.prisma의 directUrl(마이그레이션 전용 직접 연결). CI는 풀러가 없어 같은 값.
      DIRECT_URL: postgresql://sports_erp:change-me-in-local-env@localhost:5432/sports_erp?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # 깨끗한 환경에는 생성된 Prisma Client가 없어 빌드가 실패한다(@prisma/client에서 Role 등 미export).
      - name: Prisma generate
        run: npm run prisma:generate --workspace=apps/api

      # 위 postgres 서비스는 스키마가 비어 있는 빈 컨테이너다 — 추적된 migrations/를 그대로 적용한다.
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      # auth-lifecycle 등 일부 스펙이 고정된 데모 계정(정하늘·김민수·박서연·이수진)의 존재를 전제한다.
      - name: Prisma seed
        run: npm run prisma:seed --workspace=apps/api

      # package.json의 lint 스크립트는 --fix라서 CI에서는 쓰지 않는다. 검사만 한다(warning은 통과, error만 실패).
      - name: Lint
        run: npm exec --workspace=apps/api -- eslint .

      - name: Build
        run: npm run build --workspace=apps/api

      - name: Test
        run: npm test --workspace=apps/api

  admin-web:
    name: admin-web (lint · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm exec --workspace=apps/admin-web -- eslint .

      # tsc -b 로 타입체크 후 vite build
      - name: Build
        run: npm run build --workspace=apps/admin-web

  # D38 — 문서 구조가 다시 썩지 않게 하는 신호(끊긴 링크·옛 문서 이름·ADR ID·진입 문서 크기 상한·인덱스 누락).
  docs:
    name: docs (doc-check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Doc check
        run: node scripts/doc-check.mjs

