 Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="760" dy="0">매뉴얼 · 기타</tspan></text><path d="M860 330 L890 330" fill="none" stroke="#5F6C74" stroke-width="2.5" marker-end="url(#mk-f15-gray)" stroke-linejoin="round"/><rect x="890" y="286" width="290" height="88" rx="10" fill="#ECF0EF" stroke="#5F6C74" stroke-width="1.8"/><text x="1035" y="336.38" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" font-weight="700" fill="#5F6C74" text-anchor="middle"><tspan x="1035" dy="0">영구 보관</tspan></text><rect x="660" y="420" width="520" height="80" rx="10" fill="#FFFFFF" stroke="#C5D1CE" stroke-width="1.8"/><text x="920" y="454.34" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="600" fill="#17212B" text-anchor="middle"><tspan x="920" dy="0">보존기한이 30일 안으로 다가오면</tspan><tspan x="920" dy="23">본사에 알림 목록으로 보여준다</tspan></text></svg>