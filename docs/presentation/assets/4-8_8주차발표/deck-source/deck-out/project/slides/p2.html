<section id="p2" data-transition="fade" style="background:#1E3A5F; color:#F4F5F3; font-family:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; padding:128px 176px; display:flex; flex-direction:column; gap:24px"><div style="flex:1"></div><p style="font-family:'JetBrains Mono', 'Noto Sans KR', Consolas, monospace; font-size:28px; font-weight:600; letter-spacing:4px; color:#B9C7D8">PART 02</p><h1 style="font-family:'Gothic A1', 'Noto Sans KR', 'Malgun Gothic', sans-serif; font-size:120px; font-weight:900; line-height:1.05; letter-spacing:-2px; color:#F4F5F3">계약 관리</h1><p style="font-size:44px; font-weight:500; color:#D7E0EA">계약 정보와 계약서를 시스템에서 관리합니다</p><div style="flex:1"></div><aside>지금까지 앱에서 바꿀 수 있는 계약 데이터는 계약 상태 하나였다. 계약 상대방·기간은 시드 값이었고, 갱신해도 새 종료일을 넣을 곳이 없었고, 새 지점을 만들 수 없었다. 이번 주에 갱신·정정·신규 지점 등록(D68), 계약 회차와 계약서 파일(D69), 계약 파일 보존(D71)을 만들었다. 모두 본사 전용이다.</aside></section>
