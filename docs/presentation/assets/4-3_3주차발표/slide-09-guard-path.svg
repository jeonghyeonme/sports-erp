<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="요청은 로그인, 역할, 지점의 세 관문을 차례로 통과해야 하고, 다른 지점의 데이터는 마지막 관문에서 막힌다" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><defs><marker id="mk-f09-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#17212B"/></marker><marker id="mk-f09-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#B4302A"/></marker></defs><rect width="1200" height="320" fill="#FFFFFF"/><text x="20" y="34" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#17212B" text-anchor="start"><tspan x="20" dy="0">요청이 데이터에 닿기까지</tspan></text><rect x="20" y="96" width="130" height="96" rx="10" fill="#FFFFFF" stroke="#C5D1CE" stroke-width="1.8"/><text x="85" y="150.9" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="20" font-weight="700" fill="#17212B" text-anchor="middle"><tspan x="85" dy="0">API 요청</tspan></text><rect x="200" y="84" width="250" height="120" rx="10" fill="#ECF0EF" stroke="#5F6C74" stroke-width="2"/><text x="325" y="140.44" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="22" font-weight="700" fill="#5F6C74" text-anchor="middle"><tspan x="325" dy="0">로그인 확인</tspan></text><text x="325" y="164.32" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" font-weight="400" fill="#17212B" text-anchor="middle"><tspan x="325" dy="0">토큰(JWT) 검증</tspan></text><path d="M150 144 L200 144" fill="none" stroke="#17212B" stroke-width="2.5" marker-end="url(#mk-f09-ink)" stroke-linejoin="round"/><path d="M325 204 L325 246" fill="no