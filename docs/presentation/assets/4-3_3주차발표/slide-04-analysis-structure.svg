x Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10" font-weight="500" fill="#17212B" text-anchor="middle"><tspan x="976" dy="0"> </tspan></text><text x="976" y="374.38" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" font-weight="400" fill="#17212B" text-anchor="middle"><tspan x="976" dy="0">지점에 계약 상태를 두고</tspan><tspan x="976" dy="26">종료되면 신규 활동을 막는다</tspan></text><text x="600" y="508" font-family="'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="17" font-weight="500" fill="#566771" text-anchor="middle"><tspan x="600" dy="0">영역 하나만 읽어도 이해되도록 구성했다</tspan></text></svg>