services:
  - type: web
    name: sports-erp-api
    runtime: node
    plan: free
    region: singapore
    branch: main-5x9td9
    # NPM_CONFIG_PRODUCTION=false가 없으면 npm install이 devDependencies(@nestjs/cli)를
    # 건너뛰어 `nest: not found`로 빌드가 실패한다(2026-09-27 실제로 겪은 문제).
    buildCommand: npm install && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 30m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 14d
      # D26(2026-09-28) — MockDataService→PrismaService 1단계로 실제 사용 시작.
      # Supabase 프로젝트(blbjnozojvromktprqhv)의 Connection string(Prisma 탭, 풀러 경유
      # 권장 — Render도 상시구동 단일 프로세스라 지금은 직접연결로 충분하지만 이후 Lambda
      # 전환을 염두에 두고 처음부터 풀러 엔드포인트를 씀)을 Supabase 대시보드에서 그대로
      # 복사해 Render 대시보드에서 직접 설정할 것 — 비밀번호가 포함된 값이라 MCP로 대신
      # 가져오거나 이 파일에 채울 수 없음(JWT_*와 같은 sync: false 패턴).
      - key: DATABASE_URL
        sync: false

# sports-erp-web(admin-web Render Static Site)은 D25(2026-09-27)로 폐기됐다.
# admin-web은 이제 cloudflare-worker/의 정적 자산으로 배포된다(sports-erp-api-gateway
# Worker가 UI+API 프록시+rate limit을 모두 같은 오리진에서 서빙 — CORS/새로고침 404
# 버그를 구조적으로 없앤다). 배포 방법은 cloudflare-worker/README.md 참고.
# 실제 Render sports-erp-web 서비스 삭제는 Cloudflare 쪽 동작 확인 후 사용자가 대시보드에서 진행.
